<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat gallery</title>
  </head>
  <body>
    <header>
      <h1>Cat breeds around the world</h1>
    </header>
    <main>
      <div id = "ImageView">
        Hover over an image to view a cat breed
      </div>
      <div id = "desc">
        Hover over an image to view description
      </div>
     <div class = "gallery">
      <img class = "Preview" alt ="Maine Coon: A gentle giant that is friendly with people, intelligent, and usually calm." src = "https://purebredkitties.com/cdn/shop/files/michael-maine-coon-kitten-majestic-ginger-897.webp?v=1737973398" onmouseover = "Insert(this)" onmouseleave = "Undo()">
      <img class = "Preview" alt ="Ragdoll: A gentle and affectionate cat that enjoys being around people and is easygoing." src = "https://www.litter-robot.com/media/wysiwyg/ragdoll-1.png" onmouseover = "Insert(this)" onmouseleave = "Undo()">
      <img class = "Preview" alt ="British Shorthair: A calm and independent cat that is friendly but also enjoys its own space." src = "https://mybritishshorthair.com/wp-content/uploads/2020/04/1280px-A_two_years_old_British_Shorthair_cat.jpg" onmouseover = "Insert(this)" onmouseleave = "Undo()">
      <img class = "Preview" alt ="Russian Blue: A quiet and intelligent cat that forms strong bonds with its owners and is very loyal." src = "https://tse3.mm.bing.net/th/id/OIP.Fc4mgIHkXakcAWK0R4vD_wHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" onmouseover = "Insert(this)" onmouseleave = "Undo()">
      <img class = "Preview" alt ="Siamese: A social and affectionate cat that is highly intelligent, playful, and loves interacting with people." src = "https://www.catsunleashed.com/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fsiamese_cat_breed.7d7333c5.png&w=1920&q=75" onmouseover = "Insert(this)" onmouseleave = "Undo()">
      <img class = "Preview" alt ="Tabby: A friendly and active cat that is naturally curious and loves exploring new places." src = "https://tse1.mm.bing.net/th/id/OIP.fWYX_tPK_yMtyi1O6qETMAHaJ4?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" onmouseover = "Insert(this)" onmouseleave = "Undo()">
     </div>
    </main>
    <footer>
      <p>Purrfect cuteness</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
